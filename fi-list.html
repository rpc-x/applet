<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>选择金融机构</title>
<style>
:root {
  --primary: #2F7CF6;
  --primary-dark: #1E6AE0;
  --primary-soft: #E8F1FE;
  --danger: #E54D42;
  --text: #1A1A1A;
  --text-2: #666;
  --text-3: #999;
  --bg: #F5F6F8;
  --white: #FFF;
  --promo: #FF8A1A;
  --new: #2F7CF6;
  --connecting: #19B36B;
  --paused: #A0A5B0;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

body.sheet-open { overflow: hidden; height: 100%; }

/* ===== 顶栏 ===== */
.nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 44px;
  padding: 0 8px 0 4px;
  padding-top: env(safe-area-inset-top, 0px);
  height: calc(44px + env(safe-area-inset-top, 0px));
  background: var(--white);
  border-bottom: 1px solid #F0F0F0;
  position: sticky;
  top: 0;
  z-index: 30;
}
.nav-back {
  width: 40px; height: 44px;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; color: #333; line-height: 1;
}
.nav-title { font-size: 17px; font-weight: 600; }
.nav-capsule {
  display: flex; height: 30px;
  border: 1px solid #E5E5E5; border-radius: 15px; overflow: hidden; background: #FAFAFA;
}
.nav-capsule span {
  width: 38px; display: flex; align-items: center; justify-content: center;
  font-size: 13px; color: #333;
}
.nav-capsule span + span { border-left: 1px solid #E5E5E5; }

/* ===== 步骤条 ===== */
.stepper {
  display: flex;
  background: var(--white);
  padding: 12px 4px 14px;
}
.step {
  flex: 1;
  text-align: center;
  position: relative;
}
.step:not(:last-child)::after {
  content: "";
  position: absolute;
  top: 11px;
  left: calc(50% + 12px);
  width: calc(100% - 24px);
  height: 2px;
  background: #D9E2F0;
}
.step.done:not(:last-child)::after,
.step.active:not(:last-child)::after { background: var(--primary); }
.step-dot {
  width: 22px; height: 22px; margin: 0 auto;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 600;
  background: #E8EDF5; color: #9AA4B5;
  position: relative; z-index: 1;
}
.step.done .step-dot,
.step.active .step-dot { background: var(--primary); color: #fff; }
.step-label {
  margin-top: 6px;
  font-size: 11px;
  color: var(--text-3);
}
.step.done .step-label,
.step.active .step-label { color: var(--primary); font-weight: 500; }

/* ===== 列表 ===== */
.list {
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* ===== 卡片：全部用文档流，不用绝对定位 ===== */
.card {
  background: var(--white);
  border-radius: 10px;
  padding: 12px;
}
.card.is-disabled { opacity: 0.9; }

.card-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 10px;
}
.card-top-left {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  min-width: 0;
  flex: 1;
}
.logo {
  width: 28px; height: 28px; border-radius: 6px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: #fff;
}
.logo.dj { background: linear-gradient(135deg, #5B8DEF, #3A6FD8); }
.logo.dd { background: linear-gradient(135deg, #E85D4A, #C94432); }
.logo.gs { background: linear-gradient(135deg, #C8102E, #8B0A1E); font-size: 9px; }

.brand-block { min-width: 0; flex: 1; }
.brand-line {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 6px;
}
.brand { font-size: 15px; font-weight: 600; }
.badge {
  font-size: 10px; line-height: 1; padding: 3px 5px;
  border-radius: 3px; font-weight: 600; color: #fff;
}
.badge.new { background: var(--new); }
.badge.promo { background: var(--promo); }
.badge.connecting { background: var(--connecting); }
.badge.paused { background: var(--paused); }

.premium-box {
  flex-shrink: 0;
  text-align: right;
  padding-left: 4px;
}
.premium-box .pc-label {
  display: block;
  font-size: 11px;
  color: var(--text-3);
  margin-bottom: 2px;
}
.premium-box .pc-val {
  font-size: 15px;
  font-weight: 700;
  color: var(--danger);
  white-space: nowrap;
}
.premium-box .pc-unit { font-size: 11px; font-weight: 500; }

.entity-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 10px;
  min-width: 0;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.entity-row:active { opacity: 0.75; }
.type-tag {
  flex-shrink: 0;
  font-size: 11px;
  color: var(--primary);
  background: var(--primary-soft);
  padding: 2px 6px;
  border-radius: 3px;
}
.entity-name {
  flex: 1;
  min-width: 0;
  font-size: 13px;
  font-weight: 600;
  color: var(--primary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.entity-arrow { color: var(--primary); flex-shrink: 0; }

.fields {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 4px 14px;
  margin-bottom: 8px;
  font-size: 12px;
  color: var(--text-2);
  line-height: 1.5;
}
.field {
  display: inline-flex;
  align-items: baseline;
  gap: 2px;
  white-space: nowrap;
}
.field .label { flex-shrink: 0; }
.field .val { color: var(--danger); font-weight: 500; }
.field .val.phone { color: var(--primary); }

.tag-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 10px;
  padding: 4px 0;
}
.tag-labels {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.tag-more { color: #C0C4CC; flex-shrink: 0; font-size: 14px; }
.info-tag {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 11px;
  color: #1A8F5C;
  background: #E8F8F0;
  border: 1px solid #B8E6CF;
  border-radius: 4px;
  padding: 3px 7px;
  line-height: 1.3;
}
.info-tag::before { content: "✓"; font-size: 10px; font-weight: 700; }

.actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.btn-promo {
  height: 32px; padding: 0 12px;
  border: 1px solid var(--primary); border-radius: 4px;
  background: #fff; color: var(--primary); font-size: 13px;
  display: inline-flex; align-items: center; gap: 4px;
}
.btn-promo .chev { font-size: 10px; transition: transform .2s; }
.btn-promo.open .chev { transform: rotate(180deg); }
.btn-primary {
  height: 32px; padding: 0 16px; margin-left: auto;
  border: none; border-radius: 4px;
  background: var(--primary); color: #fff; font-size: 13px; font-weight: 500;
}
.btn-primary:active { background: var(--primary-dark); }

.promo-detail {
  display: none;
  margin-top: 10px;
  background: #F3F8FF;
  border-radius: 6px;
  padding: 10px 12px;
}
.promo-detail.show { display: block; }
.promo-detail h4 {
  font-size: 13px; color: var(--primary); font-weight: 600; margin-bottom: 6px;
  display: flex; align-items: center; gap: 4px;
}
.promo-detail h4::before {
  content: ""; width: 3px; height: 12px; background: var(--primary); border-radius: 1px;
}
.promo-detail ol {
  padding-left: 18px; font-size: 12px; color: var(--text-2); line-height: 1.7;
}

.section-divider {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 4px 0; color: var(--text-3); font-size: 13px;
}
.section-divider .line { flex: 1; height: 1px; background: #E0E3E8; }
.section-divider .arrow { font-size: 10px; transition: transform .2s; }
.section-divider.collapsed .arrow { transform: rotate(180deg); }
.coming-soon { display: flex; flex-direction: column; gap: 10px; }
.coming-soon.hidden { display: none; }

/* ===== 安心保障弹层 ===== */
.sheet-mask {
  position: fixed;
  top: 0; right: 0; bottom: 0; left: 0;
  background: rgba(0,0,0,.45);
  z-index: 1000;
  display: none;
}
.sheet-mask.show { display: block; }

.guarantee-sheet {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 1001;
  background: #FAFAF8;
  border-radius: 16px 16px 0 0;
  max-height: 80vh;
  display: none;
  flex-direction: column;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  box-shadow: 0 -8px 28px rgba(0,0,0,.12);
}
.guarantee-sheet.show { display: flex; }

.gs-header {
  position: relative;
  text-align: center;
  padding: 16px 44px 12px;
  background: linear-gradient(180deg, #F7F3EC, #FAFAF8);
  border-radius: 16px 16px 0 0;
  flex-shrink: 0;
}
.gs-header h3 { font-size: 17px; font-weight: 600; }
.gs-close, .gs-back {
  position: absolute; top: 12px;
  width: 32px; height: 32px;
  border: none; background: transparent;
  font-size: 22px; color: #999;
  display: flex; align-items: center; justify-content: center;
}
.gs-close { right: 10px; }
.gs-back { left: 6px; display: none; color: #666; }
.guarantee-sheet.is-detail .gs-back { display: flex; }

.gs-body {
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 4px 16px 24px;
  flex: 1;
  min-height: 0;
}
.gs-item {
  display: flex;
  gap: 10px;
  padding: 14px 0;
}
.gs-item + .gs-item { border-top: 1px solid #F0EEEA; }
.gs-icon { width: 20px; height: 20px; flex-shrink: 0; margin-top: 1px; }
.gs-icon svg { width: 100%; height: 100%; display: block; }
.gs-content { flex: 1; min-width: 0; }
.gs-title-row { display: flex; align-items: center; gap: 4px; }
.gs-title { font-size: 15px; font-weight: 600; }
.gs-chev { margin-left: auto; color: #C8C8C8; flex-shrink: 0; }
.gs-desc { margin-top: 6px; font-size: 12px; color: #8C8C8C; line-height: 1.65; }
.gs-item.clickable { cursor: pointer; }

.gs-detail .gd-lead { font-size: 13px; color: #666; line-height: 1.7; margin-bottom: 14px; }
.gs-detail .gd-section { margin-bottom: 14px; }
.gs-detail .gd-section h4 { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
.gs-detail .gd-section p,
.gs-detail .gd-section li { font-size: 13px; color: #666; line-height: 1.7; }
.gs-detail .gd-section ul { padding-left: 18px; }
.gs-detail .gd-section li + li { margin-top: 6px; }
.gs-detail .gd-note {
  margin-top: 12px; padding: 10px 12px;
  background: #F5F1EA; border-radius: 8px;
  font-size: 12px; color: #8A7A66; line-height: 1.65;
}

/* ===== 机构详情弹层 ===== */
.inst-sheet {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 1001;
  background: #FFF;
  border-radius: 16px 16px 0 0;
  max-height: 85vh;
  display: none;
  flex-direction: column;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  box-shadow: 0 -8px 28px rgba(0,0,0,.12);
}
.inst-sheet.show { display: flex; }
.is-header {
  position: relative;
  flex-shrink: 0;
  padding: 16px 44px 0;
  text-align: center;
  border-bottom: 1px solid #F0F0F0;
}
.is-header h3 {
  font-size: 17px; font-weight: 600;
  padding-bottom: 12px;
}
.is-close {
  position: absolute; top: 12px; right: 10px;
  width: 32px; height: 32px;
  border: none; background: transparent;
  font-size: 22px; color: #999;
  display: flex; align-items: center; justify-content: center;
}
.is-tabs {
  display: flex;
  gap: 0;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  padding: 0 8px;
}
.is-tab {
  flex-shrink: 0;
  padding: 10px 12px;
  font-size: 14px;
  color: var(--text-3);
  border: none;
  background: transparent;
  position: relative;
  white-space: nowrap;
}
.is-tab.active {
  color: var(--primary);
  font-weight: 600;
}
.is-tab.active::after {
  content: "";
  position: absolute;
  left: 12px; right: 12px; bottom: 0;
  height: 2px;
  background: var(--primary);
  border-radius: 1px;
}
.is-body {
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 16px;
  flex: 1;
  min-height: 0;
}
.is-panel { display: none; }
.is-panel.active { display: block; }
.is-panel h4 {
  font-size: 14px; font-weight: 600;
  margin: 14px 0 8px;
}
.is-panel h4:first-child { margin-top: 0; }
.is-panel p, .is-panel li {
  font-size: 13px; color: #666; line-height: 1.7;
}
.is-panel ul, .is-panel ol { padding-left: 18px; }
.is-panel li + li { margin-top: 6px; }
.is-kv {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid #F5F5F5;
  font-size: 13px;
}
.is-kv .k { color: var(--text-3); flex-shrink: 0; }
.is-kv .v { color: var(--text); text-align: right; font-weight: 500; }
.is-kv .v.em { color: var(--danger); }
.is-intro-head {
  display: flex;
  gap: 12px;
  align-items: center;
  margin-bottom: 14px;
}
.is-intro-head .logo {
  width: 44px; height: 44px; border-radius: 8px; font-size: 13px;
}
.is-intro-head .name { font-size: 16px; font-weight: 600; }
.is-intro-head .meta { font-size: 12px; color: var(--text-3); margin-top: 4px; }
.is-note {
  margin-top: 14px; padding: 10px 12px;
  background: #F5F7FA; border-radius: 8px;
  font-size: 12px; color: #6B7A90; line-height: 1.65;
}
</style>
</head>
<body>

<header class="nav">
  <div class="nav-back" title="返回">‹</div>
  <div class="nav-title">选择金融机构</div>
  <div class="nav-capsule"><span>···</span><span>○</span></div>
</header>

<div class="stepper">
  <div class="step done">
    <div class="step-dot">⋯</div>
    <div class="step-label">上传材料</div>
  </div>
  <div class="step active">
    <div class="step-dot">4</div>
    <div class="step-label">选机构</div>
  </div>
  <div class="step">
    <div class="step-dot">5</div>
    <div class="step-label">确认</div>
  </div>
  <div class="step">
    <div class="step-dot">6</div>
    <div class="step-label">签章支付</div>
  </div>
</div>

<div class="list" id="instList"></div>

<div class="sheet-mask" id="gsMask"></div>
<div class="guarantee-sheet" id="gsSheet" role="dialog" aria-labelledby="gsTitle">
  <div class="gs-header">
    <button type="button" class="gs-back" id="gsBack" aria-label="返回">‹</button>
    <h3 id="gsTitle">安心保障</h3>
    <button type="button" class="gs-close" id="gsClose" aria-label="关闭">×</button>
  </div>
  <div class="gs-body" id="gsBody"></div>
</div>

<div class="inst-sheet" id="instSheet" role="dialog" aria-labelledby="instTitle">
  <div class="is-header">
    <h3 id="instTitle">机构详情</h3>
    <button type="button" class="is-close" id="instClose" aria-label="关闭">×</button>
    <div class="is-tabs" id="instTabs">
      <button type="button" class="is-tab active" data-tab="intro">机构介绍</button>
      <button type="button" class="is-tab" data-tab="rate">费率</button>
      <button type="button" class="is-tab" data-tab="terms">条款</button>
      <button type="button" class="is-tab" data-tab="refund">退款流程</button>
    </div>
  </div>
  <div class="is-body" id="instBody"></div>
</div>

<script>
const TARGET_AMOUNT = 530000;

const GUARANTEE_CATALOG = {
  issueTime: {
    id: "issueTime",
    title: "出函时效",
    hasDetail: true,
    descTpl: (inst) =>
      `本机构承诺出函时效为「${inst.issueTime}」。时效自支付成功且材料齐全起算；若机构仅工作日受理，非工作时间下单将顺延至下一工作日 9:00 起算。可点击“>”了解详细规则`,
    detailTpl: (inst) => `
      <div class="gs-detail">
        <p class="gd-lead">本机构承诺出函时效为 <b>${inst.issueTime}</b>，具体规则如下。</p>
        <div class="gd-section">
          <h4>1. 时效起算点</h4>
          <p>以「支付成功且投保材料齐全」的时刻起算。仅支付成功但材料不齐的，自材料补齐之日起算。</p>
        </div>
        <div class="gd-section">
          <h4>2. 工作日与节假日</h4>
          <ul>
            <li>若机构仅工作日受理：非工作时间下单，时效顺延至下一工作日 9:00 起算。</li>
            <li>支持 24 小时出函的机构：按自然时起算（以机构配置为准）。</li>
          </ul>
        </div>
        <div class="gd-section">
          <h4>3. 超时处理</h4>
          <p>超出承诺时效仍未出函的，可联系客服催办；因用户材料问题、法院系统异常等非机构原因导致的延误，不计入承诺时效。</p>
        </div>
        <p class="gd-note">说明：卡片展示的出函时效用于说明承诺时长；实际排序与受理能力以平台规则及机构配置为准。</p>
      </div>`
  },
  refund7d: {
    id: "refund7d",
    title: "7天无理由退保",
    hasDetail: true,
    descTpl: () =>
      "支持投保后 7 天内无理由退保。未出函或符合退保条件的订单，保费按规则原路退回；已出函且产生法院使用的情形除外，可点击“>”了解详细规则",
    detailTpl: () => `
      <div class="gs-detail">
        <p class="gd-lead">本产品支持投保后 <b>7 天内无理由退保</b>，规则如下。</p>
        <div class="gd-section">
          <h4>1. 适用条件</h4>
          <ul>
            <li>自支付成功之日起 7 个自然日内提出退保申请；</li>
            <li>保函尚未被法院接收/使用；</li>
            <li>订单状态允许发起退保。</li>
          </ul>
        </div>
        <div class="gd-section">
          <h4>2. 退款说明</h4>
          <ul>
            <li>符合条件的保费按原支付路径退回；</li>
            <li>面签费、送函费等已实际发生的附加费用，按实际发生情况扣除或不予退还；</li>
            <li>退款到账时间以支付渠道为准，一般 1–3 个工作日。</li>
          </ul>
        </div>
        <div class="gd-section">
          <h4>3. 不适用情形</h4>
          <ul>
            <li>保函已送达法院并被接收使用；</li>
            <li>超过 7 天冷静期；</li>
            <li>存在欺诈、虚假材料等违规情形。</li>
          </ul>
        </div>
        <p class="gd-note">如需退保，请在订单详情中发起申请，或联系机构客服协助处理。</p>
      </div>`
  },
  flashRefund: {
    id: "flashRefund",
    title: "闪电退款",
    hasDetail: true,
    descTpl: () => "符合条件的退保申请提交后，系统将优先处理并快速完成退款到账。可点击“>”了解详细规则",
    detailTpl: () => `
      <div class="gs-detail">
        <p class="gd-lead">闪电退款为符合条件用户提供的优先退款通道。</p>
        <div class="gd-section">
          <h4>服务说明</h4>
          <ul>

function floorPremium(amount, ratePermille, minPremium) {
  const raw = Math.floor(amount * ratePermille / 1000);
  if (minPremium != null && minPremium > 0) return Math.max(raw, minPremium);
  return raw;
}

function fmtMoney(n) {
  return Number(n).toFixed(2) + "元";
}

function fieldHtml(label, valueHtml, opts = {}) {
  if (opts.hide) return "";
  return `<div class="field"><span class="label">${label}</span><span class="val ${opts.valClass || ""}">${valueHtml}</span></div>`;
}

function renderCard(inst) {
  const actual = floorPremium(TARGET_AMOUNT, inst.ratePermille, inst.minPremium);
  const disabled = inst.status !== "online";
  const badges = (inst.badges || [])
    .map(b => `<span class="badge ${b.cls}">${b.text}</span>`)
    .join("");

  const fields = [
    fieldHtml("面签费", fmtMoney(inst.faceSignFee), {
      hide: !(inst.faceSignFee != null && inst.faceSignFee > 0)
    }),
    fieldHtml("送函费", fmtMoney(inst.deliveryFee), {
      hide: !(inst.deliveryFee != null && inst.deliveryFee > 0)
    }),
    fieldHtml("客服电话", inst.servicePhone || "", {
      hide: !inst.servicePhone,
      valClass: "phone"
    })
  ].join("");

  const tags = [
    `<span class="info-tag">出函时效 ${inst.issueTime}</span>`,
    inst.supportRefund7d ? `<span class="info-tag">支持7天无理由退保</span>` : ""
  ].filter(Boolean).join("");

  const tagRow = tags
    ? `<div class="tag-row" data-guarantee="${inst.id}" role="button" tabindex="0" aria-label="查看安心保障">
         <div class="tag-labels">${tags}</div><span class="tag-more">›</span>
       </div>`
    : "";

  let actions = "";
  if (!disabled) {
    const promoBtn = inst.promo
      ? `<button type="button" class="btn-promo ${inst.promoOpen ? "open" : ""}" data-promo="${inst.id}">限时优惠 <span class="chev">▾</span></button>`
      : "";
    actions = `<div class="actions">${promoBtn}<button type="button" class="btn-primary">立即办理</button></div>`;
  }

  const promoDetail = inst.promo
    ? `<div class="promo-detail ${inst.promoOpen ? "show" : ""}" id="promo-${inst.id}">
         <h4>优惠详情</h4>
         <ol>${inst.promo.items.map(t => `<li>${t}</li>`).join("")}</ol>
       </div>`
    : "";

  return `
    <article class="card ${disabled ? "is-disabled" : ""}" data-id="${inst.id}">
      <div class="card-top">
        <div class="card-top-left">
          <div class="logo ${inst.logoClass}">${inst.logoText}</div>
          <div class="brand-block">
            <div class="brand-line">
              <span class="brand">${inst.brand}</span>
              ${badges}
            </div>
          </div>
        </div>
        <div class="premium-box">
          <span class="pc-label">实际保费</span>
          <span class="pc-val">${Number(actual).toFixed(2)}<span class="pc-unit">元</span></span>
        </div>
      </div>
      <div class="entity-row" data-inst-detail="${inst.id}" role="button" tabindex="0" aria-label="查看机构详情">
        <span class="type-tag">${inst.type}</span>
        <span class="entity-name">${inst.entity}</span>
        <span class="entity-arrow">›</span>
      </div>
      ${fields ? `<div class="fields">${fields}</div>` : ""}
      ${tagRow}
      ${actions}
      ${promoDetail}
    </article>`;
}

function render() {
  const online = institutions.filter(i => i.status === "online");
  const soon = institutions.filter(i => i.status !== "online");
  const list = document.getElementById("instList");

  list.innerHTML =
    online.map(renderCard).join("") +
    `<div class="section-divider" id="soonToggle">
       <span class="line"></span><span>即将上线机构</span><span class="arrow">▴</span><span class="line"></span>
     </div>
     <div class="coming-soon" id="soonList">${soon.map(renderCard).join("")}</div>`;

  list.querySelectorAll("[data-promo]").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.getAttribute("data-promo");
      const panel = document.getElementById("promo-" + id);
      const open = panel.classList.toggle("show");
      btn.classList.toggle("open", open);
    });
  });

  list.querySelectorAll("[data-guarantee]").forEach(row => {
    const open = () => {
      const id = Number(row.getAttribute("data-guarantee"));
      const inst = institutions.find(i => i.id === id);
      if (inst) openGuaranteeSheet(inst);
    };
    row.addEventListener("click", open);
  });

  list.querySelectorAll("[data-inst-detail]").forEach(row => {
    row.addEventListener("click", () => {
      const id = Number(row.getAttribute("data-inst-detail"));
      const inst = institutions.find(i => i.id === id);
      if (inst) openInstSheet(inst);
    });
  });

  document.getElementById("soonToggle").addEventListener("click", () => {
    const soonList = document.getElementById("soonList");
    const hidden = soonList.classList.toggle("hidden");
    document.getElementById("soonToggle").classList.toggle("collapsed", hidden);
  });
}

function buildGuaranteeItems(inst) {
  return GUARANTEE_DISPLAY_KEYS
    .map(key => GUARANTEE_CATALOG[key])
    .filter(Boolean)
    .filter(item => {
      if (item.id === "refund7d") return !!inst.supportRefund7d;
      if (item.id === "issueTime") return !!inst.issueTime;
      return true;
    });
}

function setInstTab(tab) {
  _instTab = tab;
  document.querySelectorAll("#instTabs .is-tab").forEach(el => {
    el.classList.toggle("active", el.getAttribute("data-tab") === tab);
  });
  if (_instDetail) renderInstBody(_instDetail);
  document.getElementById("instBody").scrollTop = 0;
}

function openInstSheet(inst) {
  closeGuaranteeSheet(false);
  _instDetail = inst;
  _instTab = "intro";
  document.getElementById("instTitle").textContent = inst.brand;
  document.querySelectorAll("#instTabs .is-tab").forEach(el => {
    el.classList.toggle("active", el.getAttribute("data-tab") === "intro");
  });
  renderInstBody(inst);
  document.getElementById("gsMask").classList.add("show");
  document.getElementById("instSheet").classList.add("show");
  document.body.classList.add("sheet-open");
}

function closeInstSheet() {
  document.getElementById("instSheet").classList.remove("show");
  document.getElementById("gsMask").classList.remove("show");
  document.body.classList.remove("sheet-open");
  _instDetail = null;
}

function renderGuaranteeList() {
  const sheet = document.getElementById("gsSheet");
  const body = document.getElementById("gsBody");
  document.getElementById("gsTitle").textContent = "安心保障";
  sheet.classList.remove("is-detail");

  body.innerHTML = buildGuaranteeItems(_gsInst).map(item => `
    <div class="gs-item ${item.hasDetail ? "clickable" : ""}" data-gitem="${item.id}">
      <div class="gs-icon">${SHIELD_SVG}</div>
      <div class="gs-content">
        <div class="gs-title-row">
          <span class="gs-title">${item.title}${item.id === "issueTime" ? " " + _gsInst.issueTime : ""}</span>
          ${item.hasDetail ? `<span class="gs-chev">›</span>` : ""}
        </div>
        <p class="gs-desc">${item.descTpl(_gsInst)}</p>
      </div>
    </div>
  `).join("");

  body.querySelectorAll(".gs-item.clickable").forEach(el => {
    el.addEventListener("click", () => openGuaranteeDetail(el.getAttribute("data-gitem")));
  });
}

function openGuaranteeDetail(itemId) {
  const catalog = GUARANTEE_CATALOG[itemId];
  if (!catalog || !catalog.hasDetail) return;
  document.getElementById("gsSheet").classList.add("is-detail");
  document.getElementById("gsTitle").textContent = catalog.title;
  document.getElementById("gsBody").innerHTML = catalog.detailTpl(_gsInst);
  document.getElementById("gsBody").scrollTop = 0;
}

function openGuaranteeSheet(inst) {
  closeInstSheetKeepMask();
  _gsInst = inst;
  renderGuaranteeList();
  document.getElementById("gsMask").classList.add("show");
  document.getElementById("gsSheet").classList.add("show");
  document.body.classList.add("sheet-open");
}

function closeInstSheetKeepMask() {
  document.getElementById("instSheet").classList.remove("show");
  _instDetail = null;
}

function closeGuaranteeSheet(hideMask = true) {
  document.getElementById("gsSheet").classList.remove("show");
  document.getElementById("gsSheet").classList.remove("is-detail");
  _gsInst = null;
  if (hideMask) {
    document.getElementById("gsMask").classList.remove("show");
    document.body.classList.remove("sheet-open");
  }
}

function closeAllSheets() {
  closeGuaranteeSheet(false);
  closeInstSheet();
}

document.getElementById("gsMask").addEventListener("click", closeAllSheets);
document.getElementById("gsClose").addEventListener("click", () => closeGuaranteeSheet(true));
document.getElementById("gsBack").addEventListener("click", () => {
  if (_gsInst) renderGuaranteeList();
});
document.getElementById("instClose").addEventListener("click", closeInstSheet);
document.querySelectorAll("#instTabs .is-tab").forEach(tab => {
  tab.addEventListener("click", () => setInstTab(tab.getAttribute("data-tab")));
});

render();
</script>
