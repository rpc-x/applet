<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>诉讼保 · 登录授权</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#0F172A;display:flex;justify-content:center;align-items:flex-start;padding:16px;min-height:100vh;font-family:'Inter',sans-serif}
.phone-wrap{padding:8px 0}
.iphone-pro{width:360px;background:#FFF;border-radius:48px;box-shadow:0 30px 50px -20px rgba(0,0,0,.3),0 0 0 8px #E8ECF0,0 0 0 12px #1E293B;overflow:hidden;position:relative;height:800px;display:flex;flex-direction:column}
.dynamic-bar{padding:12px 20px 6px;display:flex;justify-content:space-between;align-items:center;background:#fff;position:relative;z-index:5}
.time{font-weight:600;font-size:15px;color:#1E293B}
.dynamic-notch{background:#111;width:108px;height:28px;border-radius:24px}
.right-icons{display:flex;gap:6px;color:#334155;font-size:12px}
.app-stage{flex:1;position:relative;overflow:hidden;background:#F4F7FB}
.app-bg{position:absolute;inset:0;border:0;width:100%;height:100%;pointer-events:none;transform:scale(1.02);filter:saturate(.85)}
.login-veil{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;background:rgba(244,247,251,.42);backdrop-filter:blur(1.5px);-webkit-backdrop-filter:blur(1.5px)}
.login-scroll{flex:1;overflow-y:auto;padding:20px 22px 28px;display:flex;flex-direction:column}
.login-brand{text-align:center;margin:18px 0 22px}
.login-logo{width:68px;height:68px;margin:0 auto 12px;border-radius:20px;background:linear-gradient(145deg,#0F4C5C,#1A6B7C);display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;box-shadow:0 12px 28px rgba(15,76,92,.28)}
.login-brand h1{font-size:24px;font-weight:800;color:#0F4C5C}
.login-brand p{font-size:12px;color:#5E6F8D;margin-top:6px;line-height:1.5}
.login-panel{background:rgba(255,255,255,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.65);border-radius:22px;padding:18px 16px 16px;box-shadow:0 10px 32px rgba(15,76,92,.1)}
.login-tabs{display:flex;gap:0;margin-bottom:16px;border-bottom:1px solid rgba(226,232,240,.9)}
.login-tabs button{flex:1;border:none;background:none;padding:10px;font-size:14px;font-weight:700;color:#94A3B8;cursor:pointer;font-family:inherit;position:relative}
.login-tabs button.on{color:#0F4C5C}
.login-tabs button.on::after{content:"";position:absolute;left:28%;right:28%;bottom:0;height:3px;border-radius:3px 3px 0 0;background:#1A6B7C}
.sp-label{font-size:12px;color:#5E6F8D;font-weight:600;margin-bottom:6px;display:block}
.sp-input{width:100%;border:1px solid #E2E8F0;border-radius:14px;padding:12px 14px;font-size:14px;margin-bottom:10px;background:rgba(250,252,254,.92);font-family:inherit}
.sms-row{display:flex;gap:8px;align-items:stretch}
.sms-row .sp-input{flex:1;margin-bottom:10px}
.sms-btn{flex-shrink:0;border:none;border-radius:14px;padding:0 14px;font-size:12px;font-weight:700;background:#EFF8FC;color:#1A6B7C;cursor:pointer;margin-bottom:10px;font-family:inherit;white-space:nowrap}
.captcha-row{display:flex;gap:8px;align-items:stretch}
.captcha-row .sp-input{flex:1;margin-bottom:10px}
.captcha-box{flex-shrink:0;width:108px;height:44px;margin-bottom:10px;border-radius:14px;border:1px solid #E2E8F0;background:#F8FAFC;cursor:pointer;overflow:hidden;position:relative;padding:0}
.captcha-box canvas{display:block;width:100%;height:100%}
.captcha-box::after{content:"点击刷新";position:absolute;right:4px;bottom:2px;font-size:8px;color:rgba(100,116,139,.55);pointer-events:none}
.agree{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:#64748B;line-height:1.55;margin:4px 0 8px}
.agree input{margin-top:2px}
.agree a{color:#1A6B7C;text-decoration:none}
.btn-primary{width:100%;background:linear-gradient(95deg,#0F4C5C,#1A6B7C);color:#fff;border:none;border-radius:40px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;margin-top:6px;font-family:inherit}
.btn-wx{width:100%;margin-top:10px;border:none;border-radius:40px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;background:#07C160;color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-wx i{font-size:18px}
.footer-link{text-align:center;font-size:13px;color:#6F8FAA;margin-top:14px}
.footer-link a{color:#1A6B7C;font-weight:700;cursor:pointer;text-decoration:none}
.hint{text-align:center;font-size:11px;color:#94A3B8;margin-top:14px;line-height:1.5}
.side-note{max-width:280px;margin:40px 0 0 28px;color:#94A3B8;font-size:13px;line-height:1.7}
.side-note strong{color:#E2E8F0;display:block;font-size:15px;margin-bottom:8px}
.side-note code{background:#1E293B;padding:2px 6px;border-radius:6px;font-size:11px;color:#A5F3FC}

/* 微信授权弹层 */
.wx-mask{position:absolute;inset:0;z-index:40;background:rgba(15,23,42,.45);display:none;align-items:flex-end;justify-content:center;border-radius:0 0 48px 48px;padding:0 0 18px}
.wx-mask.show{display:flex;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.wx-sheet{width:calc(100% - 28px);background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 16px 40px rgba(0,0,0,.25);animation:sheetUp .28s cubic-bezier(.2,.8,.2,1)}
@keyframes sheetUp{from{transform:translateY(24px);opacity:.6}to{transform:translateY(0);opacity:1}}
.wx-sheet-head{padding:18px 18px 10px;display:flex;align-items:center;gap:12px}
.wx-app-ico{width:44px;height:44px;border-radius:10px;background:linear-gradient(145deg,#0F4C5C,#1A6B7C);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.wx-sheet-head h3{font-size:15px;font-weight:700;color:#1C2E36}
.wx-sheet-head p{font-size:12px;color:#64748B;margin-top:3px}
.wx-sheet-body{padding:8px 18px 14px}
.wx-perm{font-size:13px;color:#334155;padding:8px 0;display:flex;align-items:flex-start;gap:8px;line-height:1.45}
.wx-perm i{color:#07C160;margin-top:2px;width:16px;text-align:center}
.wx-sheet-foot{display:flex;border-top:1px solid #F1F5F9}
.wx-sheet-foot button{flex:1;border:none;background:#fff;padding:15px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.wx-sheet-foot .wx-deny{color:#64748B;border-right:1px solid #F1F5F9}
.wx-sheet-foot .wx-allow{color:#07C160}
.toast{position:absolute;left:50%;bottom:88px;transform:translateX(-50%);background:rgba(15,23,42,.92);color:#fff;font-size:12px;padding:10px 16px;border-radius:24px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}
.toast.show{opacity:1}
.workspace{display:flex;align-items:flex-start;justify-content:center}
@media(max-width:720px){.side-note{display:none}}
</style>
</head>
<body>
<div class="workspace">
<div class="phone-wrap">
<div class="iphone-pro">
<div class="dynamic-bar"><div class="time">9:41</div><div class="dynamic-notch"></div><div class="right-icons"><i class="fas fa-signal"></i><i class="fas fa-battery-full"></i></div></div>
<div class="app-stage">
<iframe class="app-bg" src="诉讼保.html?embed=1" title="诉讼保小程序背景"></iframe>
<div class="login-veil" id="loginVeil">
<div class="login-scroll">
<div class="login-brand">
<div class="login-logo"><i class="fas fa-shield-alt"></i></div>
<h1>诉讼保</h1>
<p>机构业务工作台<br>安全登录 · 高效协同</p>
</div>
<div class="login-panel" id="loginPanel">
<div class="login-tabs">
<button type="button" class="on" data-tab="login">登录</button>
</div>
<div id="formLogin">
<span class="sp-label">手机号</span>
<input class="sp-input" id="authPhone" type="tel" maxlength="11" placeholder="请输入手机号" value="13800138000">
<span class="sp-label">短信验证码</span>
<div class="sms-row"><input class="sp-input" id="authSms" type="tel" maxlength="6" placeholder="请输入验证码" value="123456"><button type="button" class="sms-btn" id="btnSms">获取验证码</button></div>
<span class="sp-label">图形验证码</span>
<div class="captcha-row"><input class="sp-input" id="authCaptcha" type="text" maxlength="4" placeholder="请输入右侧字符" autocomplete="off"><button type="button" class="captcha-box" id="authCaptchaBox" title="点击刷新" aria-label="刷新图形验证码"><canvas id="authCaptchaCanvas" width="108" height="44"></canvas></button></div>
<label class="agree"><input type="checkbox" id="authAgree" checked> 已阅读并同意 <a href="#">《用户服务协议》</a> 与 <a href="#">《隐私政策》</a></label>
<button type="button" class="btn-primary" id="btnLogin">登录</button>
<button type="button" class="btn-wx" id="btnWx"><i class="fab fa-weixin"></i> 微信一键登录</button>
</div>
<div id="formRegister" style="display:none">
<span class="sp-label">手机号</span>
<input class="sp-input" id="regPhone" type="tel" maxlength="11" placeholder="请输入手机号">
<span class="sp-label">验证码</span>
<div class="sms-row"><input class="sp-input" id="regSms" type="tel" maxlength="6" placeholder="请输入验证码"><button type="button" class="sms-btn" id="btnRegSms">获取验证码</button></div>
<span class="sp-label">设置密码</span>
<input class="sp-input" id="regPwd" type="password" placeholder="6–20位字母或数字">
<span class="sp-label">确认密码</span>
<input class="sp-input" id="regPwd2" type="password" placeholder="再次输入密码">
<label class="agree"><input type="checkbox" id="regAgree" checked> 已阅读并同意 <a href="#">《用户服务协议》</a> 与 <a href="#">《隐私政策》</a></label>
<button type="button" class="btn-primary" id="btnRegister">注册并登录</button>
</div>
</div>
<p class="hint">背景为半透明效果，可隐约看到诉讼保小程序页面<br>进入后将自动唤起微信登录授权</p>
</div>
</div>
<div class="wx-mask" id="wxMask" aria-hidden="true">
<div class="wx-sheet" role="dialog" aria-label="微信授权登录">
<div class="wx-sheet-head">
<div class="wx-app-ico"><i class="fas fa-shield-alt"></i></div>
<div>
<h3>诉讼保 申请</h3>
<p>获取你的微信授权以完成登录</p>
</div>
</div>
<div class="wx-sheet-body">
<div class="wx-perm"><i class="fas fa-check-circle"></i><span>获取你的昵称、头像</span></div>
<div class="wx-perm"><i class="fas fa-check-circle"></i><span>获取你绑定的手机号</span></div>
<div class="wx-perm"><i class="fas fa-check-circle"></i><span>用于机构端账号登录与消息通知</span></div>
</div>
<div class="wx-sheet-foot">
<button type="button" class="wx-deny" id="wxDeny">拒绝</button>
<button type="button" class="wx-allow" id="wxAllow">允许</button>
</div>
</div>
</div>
<div class="toast" id="toast"></div>
</div>
</div>
</div>
<div class="side-note">
<strong>登录授权演示</strong>
独立登录页 <code>login.html</code>：半透明遮罩下可见小程序背景；打开后自动唤起微信授权弹层。授权或手机号登录后进入 <code>诉讼保.html</code>。
</div>
</div>
<script>
(function(){
const toastEl=document.getElementById('toast');
function showToast(msg){
toastEl.textContent=msg;toastEl.classList.add('show');
clearTimeout(showToast._t);showToast._t=setTimeout(()=>toastEl.classList.remove('show'),1800);
}
function enterApp(via){
try{sessionStorage.setItem('ssbao_inst_logged_in','1');sessionStorage.setItem('ssbao_inst_login_via',via||'sms')}catch(e){}
showToast(via==='wechat'?'微信授权成功':'登录成功');
setTimeout(()=>{location.href='诉讼保.html?from=login'},450);
}
function switchTab(tab){
const isLogin=tab==='login';
document.querySelectorAll('.login-tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
document.getElementById('formLogin').style.display=isLogin?'block':'none';
document.getElementById('formRegister').style.display=isLogin?'none':'block';
}
document.querySelectorAll('[data-tab]').forEach(el=>{
el.addEventListener('click',e=>{e.preventDefault();switchTab(el.dataset.tab||'login')});
});
let captchaCode='';
function genCaptcha(){
const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
let s='';for(let i=0;i<4;i++)s+=chars[Math.floor(Math.random()*chars.length)];
return s;
}
function paintCaptcha(){
const canvas=document.getElementById('authCaptchaCanvas');if(!canvas)return;
captchaCode=genCaptcha();
const dpr=window.devicePixelRatio||1,w=108,h=44;
canvas.width=w*dpr;canvas.height=h*dpr;
const ctx=canvas.getContext('2d');if(!ctx)return;
ctx.setTransform(dpr,0,0,dpr,0,0);
ctx.fillStyle='#F1F5F9';ctx.fillRect(0,0,w,h);
for(let i=0;i<5;i++){ctx.strokeStyle=`rgba(30,100,120,.35)`;ctx.beginPath();ctx.moveTo(Math.random()*w,Math.random()*h);ctx.lineTo(Math.random()*w,Math.random()*h);ctx.stroke()}
const colors=['#0F4C5C','#1A6B7C','#B45309','#1D4ED8'];
for(let i=0;i<captchaCode.length;i++){
ctx.save();ctx.translate(16+i*22,24);ctx.rotate((Math.random()-.5)*.4);
ctx.font='bold 19px Inter,sans-serif';ctx.fillStyle=colors[i%colors.length];ctx.fillText(captchaCode[i],0,0);ctx.restore();
}
const inp=document.getElementById('authCaptcha');if(inp)inp.value='';
}
paintCaptcha();
document.getElementById('authCaptcha').value=captchaCode;
document.getElementById('authCaptchaBox').addEventListener('click',()=>{paintCaptcha();showToast('已刷新图形验证码')});
document.getElementById('btnSms').addEventListener('click',()=>showToast('验证码已发送 123456'));
document.getElementById('btnRegSms').addEventListener('click',()=>showToast('验证码已发送 123456'));
document.getElementById('btnLogin').addEventListener('click',()=>{
if(!document.getElementById('authAgree').checked){showToast('请先同意协议');return}
const cap=(document.getElementById('authCaptcha').value||'').trim().toUpperCase();
if(!cap){showToast('请输入图形验证码');return}
if(cap!==captchaCode){showToast('图形验证码错误');paintCaptcha();return}
enterApp('sms');
});
document.getElementById('btnRegister').addEventListener('click',()=>{
if(!document.getElementById('regAgree').checked){showToast('请先同意协议');return}
const p1=document.getElementById('regPwd').value||'',p2=document.getElementById('regPwd2').value||'';
if(p1&&p1!==p2){showToast('两次密码不一致');return}
try{sessionStorage.setItem('ssbao_inst_need_ent','1')}catch(e){}
enterApp('register');
});
const wxMask=document.getElementById('wxMask');
function showWxAuth(){wxMask.classList.add('show');wxMask.setAttribute('aria-hidden','false')}
function hideWxAuth(){wxMask.classList.remove('show');wxMask.setAttribute('aria-hidden','true')}
document.getElementById('btnWx').addEventListener('click',showWxAuth);
document.getElementById('wxDeny').addEventListener('click',()=>{hideWxAuth();showToast('已取消微信授权，可改用手机号登录')});
document.getElementById('wxAllow').addEventListener('click',()=>{hideWxAuth();enterApp('wechat')});
/* 自动唤起微信登录授权页 */
setTimeout(showWxAuth,650);
})();
</script>
</body>
</html>
